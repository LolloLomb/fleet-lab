apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keycloak

resources:
  - network/keycloak-discovery.yaml
  - network/keycloak-service.yaml
  - network/postgres-service.yaml
  - workload/keycloak-sts.yaml
  - workload/postgres-deployment.yaml
  - namespace.yaml

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/restartPolicy
        value: Always
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: add
        path: /spec/strategy
        value:
          type: Recreate