apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
resources:
  - ../base
  - pvc/postgres-pvc.yaml

patches:
  - path: workload/postgres-deployment.yaml
    target:
      kind: Deployment
      labelSelector: app=postgres
  - path: workload/keycloak-sts.yaml
    target:
      kind: StatefulSet
      labelSelector: app=keycloak
  - patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: "node/gaia"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-type: baremetal
    target:
      kind: Deployment
  - patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: "node/gaia"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-type: baremetal
    target:
      kind: StatefulSet

images:
  - name: keycloak
    newName: keycloak/keycloak
    newTag: "26.6.4"
  - name: postgres
    newName: postgres
    newTag: "17"