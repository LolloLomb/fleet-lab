### Il backup si gestisce tramite plugin esterni
### Tolerations e nodeSelector vanno applicati sulle risorse oppure tramite patch oppure tramite una struttura kustomization + overlay
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cluster-with-metrics
  namespace: cloudnative-pg
spec:
  bootstrap:
    initdb:
      database: nometest
      owner: nometestuser
      secret:
        name: credentials
  enableSuperuserAccess: false
  instances: 3
#  affinity:
#    enablePodAntiAffinity: true
#    topologyKey: kubernetes.io/hostname
#    podAntiAffinityType: required
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    name: postgresql
    major: 18
  storage:
    size: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: credentials
  namespace: cloudnative-pg
type: kubernetes.io/basic-auth
stringData:
  username: nometestuser
  password: nometestpass
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cluster-with-metrics
  namespace: cloudnative-pg
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: cluster-with-metrics
  podMetricsEndpoints:
  - port: metrics
